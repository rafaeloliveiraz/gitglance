    .gg-seg { animation: gg-fade 0.8s ease-out; }
    .gg-ring { animation: gg-fade 1s ease-out; }
    @keyframes gg-grow { from { transform: scaleX(0); } }
    @keyframes gg-rise { from { transform: scaleY(0); } }
    @keyframes gg-fade { from { opacity: 0.15; } }
  </style><defs><clipPath id="gg-clip"><rect width="460" height="252" rx="16"/></clipPath>
