      </pattern>
      <style>
        .gg-z1 { animation: gg-zone 3.2s ease-in-out infinite alternate; }
        .gg-z2 { animation: gg-zone 4.1s ease-in-out 0.8s infinite alternate; }
        .gg-z3 { animation: gg-zone 5s ease-in-out 1.6s infinite alternate; }
        @keyframes gg-zone { from { opacity: 0.15; } to { opacity: 1; } }
      </style></defs>
      <rect width="460" height="252" rx="16" fill="#020617"/>
      <g clip-path="url(#gg-clip)">
